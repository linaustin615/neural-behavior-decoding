   <g id="text_1">
    <text style="fill: #a8b3c7; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="56.88" y="232.318125" transform="rotate(-0 56.88 232.318125)">Recorded activity</text>
   </g>
   <g id="text_2">
    <text style="fill: #edf3fa; font: 10px 'DejaVu Sans'" transform="translate(56.88 258.878438)">512 neurons</text>
    <text style="fill: #edf3fa; font: 10px 'DejaVu Sans'" transform="translate(56.88 272.355781)">32 native-frame history</text>
   </g>
   <g id="text_3">
    <text style="fill: #81b4f5; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="280.08" y="171.118125" transform="rotate(-0 280.08 171.118125)">Transformer</text>
   </g>
   <g id="text_4">
    <text style="fill: #edf3fa; font: 10px 'DejaVu Sans'" transform="translate(280.08 197.678437)">Population read-in</text>
    <text style="fill: #edf3fa; font: 10px 'DejaVu Sans'" transform="translate(280.08 211.155781)">Temporal attention + MLP</text>
   </g>
   <g id="text_5">
    <text style="fill: #f4c67a; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="280.08" y="304.318125" transform="rotate(-0 280.08 304.318125)">Population MLP</text>
   </g>
   <g id="text_6">
    <text style="fill: #edf3fa; font: 10px 'DejaVu Sans'" transform="translate(280.08 330.878438)">Patch representation</text>
    <text style="fill: #edf3fa; font: 10px 'DejaVu Sans'" transform="translate(280.08 344.355781)">Nonlinear speed readout</text>
   </g>
   <g id="text_7">
    <text style="fill: #6fe3c4; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="517.68" y="232.318125" transform="rotate(-0 517.68 232.318125)">Weighted mix</text>
   </g>
   <g id="text_8">
    <text style="fill: #edf3fa; font: 10px 'DejaVu Sans'" transform="translate(517.68 258.878438)">α × transformer</text>
    <text style="fill: #edf3fa; font: 10px 'DejaVu Sans'" transform="translate(517.68 272.355781)">+ (1 − α) × MLP</text>
   </g>
   <g id="text_9">
    <text style="fill: #6fe3c4; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="733.68" y="232.318125" transform="rotate(-0 733.68 232.318125)">Predicted speed</text>
   </g>
   <g id="text_10">
    <text style="fill: #edf3fa; font: 10px 'DejaVu Sans'" transform="translate(733.68 258.878438)">Same-frame decoding</text>
    <text style="fill: #edf3fa; font: 10px 'DejaVu Sans'" transform="translate(733.68 272.355781)">Clipped at physical zero</text>
   </g>
   <g id="text_11">
    <text style="fill: #a6b6c8; font: 9px 'DejaVu Sans'" transform="translate(511.2 329.870391)">Parents clipped at zero before mixing</text>
    <text style="fill: #a6b6c8; font: 9px 'DejaVu Sans'" transform="translate(511.2 342)">α chosen using validation only</text>
   </g>
   <g id="text_12">
    <text style="fill: #f0a882; font: 700 10px 'DejaVu Sans'; text-anchor: start" x="46.8" y="404.64" transform="rotate(-0 46.8 404.64)">OPTIONAL CORRECTION</text>
   </g>
   <g id="text_13">
    <text style="fill: #edf3fa; font: 10px 'DejaVu Sans'; text-anchor: start" x="248.4" y="404.64" transform="rotate(-0 248.4 404.64)">Activity + mix → small attention branch → bounded, movement-gated adjustment</text>
   </g>
   <g id="text_14">
    <text style="fill: #a6b6c8; font: 9px 'DejaVu Sans'; text-anchor: start" x="46.8" y="439.2" transform="rotate(-0 46.8 439.2)">Coordinates appear only in the 3D illustration. Ridge is the separately tuned linear control. Every model is fitted within its recording.</text>
   </g>
  </g>
  <g id="text_15">
   <text style="fill: #6fe3c4; font: 700 10px 'DejaVu Sans'; text-anchor: start" x="51.48" y="23.04" transform="rotate(-0 51.48 23.04)">MODEL DESIGN  /  ASSOCIATION, NOT CAUSAL SIMULATION</text>
  </g>
  <g id="text_16">
   <text style="fill: #edf3fa; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="51.48" y="48.384" transform="rotate(-0 51.48 48.384)">Two decoders, one running-speed estimate</text>
  </g>
  <g id="text_17">
   <text style="fill: #a6b6c8; font: 10px 'DejaVu Sans'; text-anchor: start" x="51.48" y="69.12" transform="rotate(-0 51.48 69.12)">The mix is the main result. The small correction is an optional research branch.</text>
  </g>
