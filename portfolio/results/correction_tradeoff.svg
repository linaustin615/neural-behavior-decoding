  <g id="text_44">
   <text style="fill: #edf3fa; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="51.48" y="47.628" transform="rotate(-0 51.48 47.628)">Quieter predictions come with a cost</text>
  </g>
  <g id="text_45">
   <text style="fill: #a6b6c8; font: 10px 'DejaVu Sans'; text-anchor: start" x="51.48" y="68.04" transform="rotate(-0 51.48 68.04)">Original learned correction versus the plain mix. Positive values mean a reduction; zero means no change.</text>
  </g>
  <g id="text_46">
   <text style="fill: #f0a882; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="51.48" y="399.168" transform="rotate(-0 51.48 399.168)">53.08% lower mean quiet predicted speed ≠ 53.08% lower overall error.</text>
  </g>
  <g id="text_47">
   <text style="fill: #a6b6c8; font: 9px 'DejaVu Sans'" transform="translate(51.48 414.931331)">Quiet: observed speed ≤0.05 training SD. Active: ≥0.5 SD. Quiet suppression is not a classification false-positive rate.</text>
   <text style="fill: #a6b6c8; font: 9px 'DejaVu Sans'" transform="translate(51.48 427.7448)">Overall gain: 1.16%; active MSE can worsen by 3.29%. Later confidence gating did not resolve this trade-off.</text>
  </g>
